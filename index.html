<title>高级网页设计 · 付佳宁</title>
<style>
  /* fjn_ 首页入口：只保留本次移动端三任务作业 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #e9eefb;
    background:
      radial-gradient(circle at 18% 12%, rgba(88, 130, 255, .18), transparent 46%),
      radial-gradient(circle at 86% 84%, rgba(255, 188, 92, .12), transparent 48%),
      #0b1018;
  }
  .fjn_wrap { width: 100%; max-width: 680px; }
  .fjn_eyebrow {
    display: inline-block;
    font-size: 12px;
    letter-spacing: .18em;
    color: #8fa6d8;
    border: 1px solid rgba(143, 166, 216, .3);
    border-radius: 999px;
    padding: 5px 14px;
    margin-bottom: 22px;
  }
  h1 { font-size: clamp(28px, 7vw, 40px); line-height: 1.3; letter-spacing: .02em; }
  h1 span { color: #ffd166; }
  .fjn_sub { margin-top: 12px; font-size: 14px; line-height: 1.9; color: #93a2c0; }
  .fjn_card {
    display: block;
    margin-top: 30px;
    padding: 26px 24px;
    border-radius: 20px;
    text-decoration: none;
    color: inherit;
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .12);
    transition: transform .22s ease, border-color .22s ease, background .22s ease;
  }
  .fjn_card:hover { transform: translateY(-3px); border-color: rgba(255, 209, 102, .42); background: rgba(255, 255, 255, .08); }
  .fjn_tag {
    display: inline-block;
    font-size: 12px;
    color: #ffd166;
    background: rgba(255, 209, 102, .12);
    border-radius: 8px;
    padding: 3px 10px;
  }
  .fjn_card h2 { margin-top: 14px; font-size: 20px; letter-spacing: .02em; }
  .fjn_card p { margin-top: 8px; font-size: 13.5px; line-height: 1.85; color: #93a2c0; }
  .fjn_go { display: inline-block; margin-top: 16px; font-size: 13px; color: #ffd166; }
  footer { margin-top: 26px; font-size: 12.5px; color: #6c7a94; text-align: center; }
</style>
</head>
<body>
<div class="fjn_wrap">
  <span class="fjn_eyebrow">高 级 网 页 设 计 · 课 堂 实 践</span>

  <a class="fjn_card" href="mobile-three-tasks.html">

    <span class="fjn_go">打开作业 →</span>
  </a>

  <footer>24002120623 付佳宁 · 高级网页设计</footer>
</div>
